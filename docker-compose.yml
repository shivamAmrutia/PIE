services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pie-postgres
    environment:
      POSTGRES_DB: pie
      POSTGRES_USER: pie
      POSTGRES_PASSWORD: pie
    ports:
      - "5432:5432"
    volumes:
      - pie_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pie -d pie"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: pie-neo4j
    environment:
      NEO4J_AUTH: neo4j/piepassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - pie_neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "piepassword", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pie-redis
    ports:
      - "6379:6379"
    volumes:
      - pie_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pie_pg_data:
  pie_neo4j_data:
  pie_redis_data:
